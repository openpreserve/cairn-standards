id: ead
title: "Encoded Archival Description (EAD)"
summary: >-
  The international XML standard for encoding archival finding aids, enabling
  consistent, machine-readable description of archival collections.

steward:
  org: "Technical Subcommittee on Encoded Archival Standards (TS-EAS), Society of American Archivists"
  homepage: "https://www.loc.gov/ead/"
  github: "https://github.com/SAA-SDT/eas-schemas"

source:
  type: github
  repo: SAA-SDT/eas-schemas
  ref: release_2026_07

links:
  - label: "EAD at the Library of Congress"
    url: "https://www.loc.gov/ead/"
  - label: "Tag Library (browse online)"
    url: "https://saa-sdt.github.io/EAS-TagLibraries/"
  - label: "EAS Best Practices"
    url: "https://saa-sdt.github.io/EAS-Best-Practices/"

major_lines:
  - major: 4
    latest: 4.0.0

releases:
  - version: 4.0.0
    lifecycle: published
    maturity: stable
    ref: EAS-2026-07
    released: "2026-07-31"
    artifacts:
      - name: ead.xsd
        role: schema
        from: repo
        path: xml-schemas/ead/ead.xsd
        title: "EAD 4 W3C XML Schema"
      - name: ead.rng
        role: relaxng
        from: repo
        path: xml-schemas/ead/ead.rng
        title: "EAD 4 RELAX NG schema"
      - name: ead.nvdl
        role: nvdl
        from: repo
        path: xml-schemas/ead/ead.nvdl
        title: "EAD 4 NVDL validation dispatcher"
      - name: ead-taglibrary.pdf
        role: taglibrary-pdf
        from: repo
        repo: SAA-SDT/EAS-TagLibraries
        ref: "20260701"
        path: pdf/EAD4-TL-eng.pdf
        title: "EAD 4 Tag Library (PDF)"

rules:
  # The built, self-contained rules. `src/ead.sch` in that repo is a 1.3 KB shell that pulls
  # in eleven relative modules; published on its own it would resolve at the top and fail one
  # level down, so what is served is the compiled artifact from `schematron/`.
  #
  # `applies_to` is corroborated by the file itself, which declares
  # <ns prefix="ead" uri="https://standards.openpreservation.org/ead/v4"/>.
  - revision: "2026-07"
    applies_to: 4
    lifecycle: published
    ref: EAS-2026-07
    released: "2026-07-31"
    artifacts:
      - name: ead.sch
        role: schematron
        from: repo
        repo: SAA-SDT/eas-schematron-validator
        path: schematron/ead.sch
        title: "EAD 4 Schematron rules"
