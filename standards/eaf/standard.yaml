id: eaf
title: "Encoded Archival Context - Functions (EAC-F)"
summary: >-
  An XML standard for encoding the functions performed by agents - the WHY behind
  the records.
based_on: "the International Standard for Describing Functions (ISDF), 2007"

steward:
  org: "Technical Subcommittee on Encoded Archival Standards (TS-EAS), Society of American Archivists"
  homepage: "https://www2.archivists.org/groups/technical-subcommittee-on-encoded-archival-standards-ts-eas"
  github: "https://github.com/SAA-SDT/eas-schemas"

# Where the artifacts really live. Cairn replicates from here; it does not store schema
# bytes in this repo. `ref` is the pre-release branch until the official tag is cut.
# NOTE: the public identifier is `eaf` (locked by the schema's targetNamespace and the
# agreed URLs); the standard's current name is EAC-F.
source:
  type: github
  repo: SAA-SDT/eas-schemas
  ref: release_2026_07

links:
  - label: "Tag Library (browse online)"
    url: "https://saa-sdt.github.io/EAS-TagLibraries/"
  - label: "EAS Best Practices"
    url: "https://saa-sdt.github.io/EAS-Best-Practices/"

major_lines:
  - major: 1
    latest: 1.0.0

releases:
  # Frozen at the official TS-EAS release tag. `source.ref` above is the pre-release branch
  # and is no longer consulted for this release: the release-level `ref:` overrides it.
  - version: 1.0.0
    lifecycle: published
    maturity: stable
    ref: EAS-2026-07
    released: "2026-07-31"
    artifacts:
      - name: eaf.xsd
        role: schema
        from: repo
        path: xml-schemas/eaf/eaf.xsd
        title: "EAC-F W3C XML Schema"
      - name: eaf.rng
        role: relaxng
        from: repo
        path: xml-schemas/eaf/eaf.rng
        title: "EAC-F RELAX NG schema"
      - name: eaf.nvdl
        role: nvdl
        from: repo
        path: xml-schemas/eaf/eaf.nvdl
        title: "EAC-F NVDL validation dispatcher"
      # Human-readable "Standard text" - mirrored from the EAS Tag Libraries.
      - name: eaf-taglibrary.pdf
        role: taglibrary-pdf
        from: repo
        repo: SAA-SDT/EAS-TagLibraries
        ref: "20260701"
        path: pdf/EAF1-TL-eng.pdf
        title: "EAC-F Tag Library (PDF)"

rules:
  # The built, self-contained rules. `src/eaf.sch` in that repo is a 1.3 KB shell that pulls
  # in eleven relative modules; published on its own it would resolve at the top and fail one
  # level down, so what is served is the compiled artifact from `schematron/`.
  #
  # `applies_to` is corroborated by the file itself, which declares
  # <ns prefix="eaf" uri="https://standards.openpreservation.org/eaf/v1"/>.
  - revision: "2026-07"
    applies_to: 1
    lifecycle: published
    ref: EAS-2026-07
    released: "2026-07-31"
    artifacts:
      - name: eaf.sch
        role: schematron
        from: repo
        repo: SAA-SDT/eas-schematron-validator
        path: schematron/eaf.sch
        title: "EAC-F 1 Schematron rules"
