name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Validate manifests
        run: cairn validate

      - name: Unit tests
        run: pytest -q

      - name: Dry-run sync (upstream reachability)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cairn sync --dry-run

      - name: Render build
        run: cairn build
