name: publish

# On merge to main: build and publish both deployment images to GHCR.
#
# Two images, because the stack needs both and they age independently:
#   web    - nginx plus an image-baked site snapshot used to seed empty volumes
#   syncer - the Python tooling that replicates upstream and re-renders on a loop
#
# The syncer is where sync/render code actually runs in production, so publishing only web
# left no route from a merged fix to the running service.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Keeps the historical untagged-repo image name so anything already pulling
      # ghcr.io/<repo>:latest is unaffected.
      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}

      # No build secret: this image only installs the tooling, it does not replicate at
      # build time the way the web image's builder stage does.
      - name: Build and push syncer
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.syncer
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/syncer:latest
            ghcr.io/${{ github.repository }}/syncer:${{ github.sha }}
