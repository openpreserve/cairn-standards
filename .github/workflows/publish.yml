name: publish

# Build and publish both deployment images to GHCR.
#
# Two images, because the stack needs both and they age independently:
#   web    - nginx plus an image-baked site snapshot used to seed empty volumes
#   syncer - the Python tooling that replicates upstream and re-renders on a loop
#
# The syncer is where sync and render code actually runs in production, so publishing only
# web left no route from a merged fix to the running service.
#
# Pushing a v* tag is the release path: it produces version-tagged images (v0.2.0 ->
# 0.2.0 and 0.2) that a deployment can pin to via CAIRN_TAG, which is what you want for a
# service whose promise is that published bytes do not move. Pushes to main keep producing
# :latest and a commit-sha tag for continuous deployment.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (web)
        id: meta_web
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/web
          # latest=auto would add `latest` to any semver tag, which is the rollback this
          # guards against; the raw entry below is the only thing that sets it.
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.meta_web.outputs.tags }}
          labels: ${{ steps.meta_web.outputs.labels }}
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (syncer)
        id: meta_syncer
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/syncer
          # latest=auto would add `latest` to any semver tag, which is the rollback this
          # guards against; the raw entry below is the only thing that sets it.
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      # No build secret: this image only installs the tooling, it does not replicate at
      # build time the way the web image's builder stage does.
      - name: Build and push syncer
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.syncer
          push: true
          tags: ${{ steps.meta_syncer.outputs.tags }}
          labels: ${{ steps.meta_syncer.outputs.labels }}
