[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cairn"
version = "0.2.0"
description = "Cairn - durable, resolvable hosting for preservation standards (standards.openpreservation.org)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Open Preservation Foundation" }]
keywords = ["standards", "schema", "preservation", "xml", "namespace", "registry"]

# Deliberately small, mostly-pure-Python dependency set - a preservation tool
# should stay buildable for years without heavy compiled dependencies.
dependencies = [
    "PyYAML>=6.0",
    "jsonschema>=4.18",
    "Jinja2>=3.1",
    "httpx>=0.27",
    "Markdown>=3.5",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
cairn = "cairn.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cairn = ["py.typed", "templates/*", "assets/*"]
