<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Cairn - Open Preservation standards{% endblock %}</title>
  <meta name="description" content="{% block description %}Durable, resolvable hosting for preservation standards.{% endblock %}">
  <link rel="stylesheet" href="/assets/cairn.css">
  <link rel="icon" href="/assets/cairn-mark.svg" type="image/svg+xml">
  {% block head %}{% endblock %}
</head>
<body>
  {% include "_opf_banner.html" %}
  <header class="site">
    <div class="wrap">
      <a class="brand" href="/">
        <img class="brand-logo" src="/assets/cairn-mark.svg" width="24" height="24" alt="" />
        <span>Open Preservation Standards</span>
      </a>
      <span class="tag">standards.openpreservation.org</span>
    </div>
  </header>
  <main>
    <div class="wrap">
      {% block content %}{% endblock %}
    </div>
  </main>
  {% include "_opf_footer.html" %}
</body>
</html>
