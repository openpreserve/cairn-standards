# Example upstream vhost for standards.openpreservation.org.
# TLS is terminated here (by OPF's existing proxy); Cairn's container serves plain HTTP.
# This snippet is illustrative — adapt to your actual proxy (nginx/Traefik/Caddy).

server {
    listen 443 ssl http2;
    server_name standards.openpreservation.org;

    ssl_certificate     /etc/letsencrypt/live/standards.openpreservation.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/standards.openpreservation.org/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8080;      # the cairn `web` container
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Redirect http -> https (Cairn's own 303s to specific schema files still work over either).
server {
    listen 80;
    server_name standards.openpreservation.org;
    return 301 https://$host$request_uri;
}
