# Cairn serving layer - plain HTTP on :8080, behind OPF's TLS-terminating reverse proxy.
# Deliberately simple: it serves the static tree produced by `cairn build` and applies the
# per-standard routing generated into cairn-routes.conf. No application logic at request time.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;

    # Serve schema serialisations with the correct XML media type. (.xhtml is already
    # mapped to application/xhtml+xml by the bundled mime.types.)
    types {
        application/xml   xsd rng nvdl sch;
    }
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    server_tokens off;
    charset_types application/xml application/xhtml+xml text/css application/json text/plain;

    gzip on;
    gzip_vary on;
    gzip_types application/xml application/xhtml+xml text/css application/json image/svg+xml text/plain;

    log_format cairn '$remote_addr "$request" $status $body_bytes_sent "$http_accept"';
    access_log /var/log/nginx/access.log cairn;

    # Does the client explicitly prefer XML over HTML? Browsers send `text/html` (matched
    # first -> 0). A bare XML tool sends `application/xml` with no text/html -> 1. Anything
    # else (including */*) -> 0, i.e. gets the human-readable RDDL namespace page.
    map $http_accept $cairn_wants_xml {
        default 0;
        "~*text/html"        0;
        "~*application/xml"  1;
        "~*text/xml"         1;
    }

    # Concrete version files are immutable; everything else gets a short cache.
    map $uri $cairn_cache {
        default                                            "public, max-age=300";
        "~^/[^/]+/v[0-9]+\.[0-9]+\.[0-9]+/"                "public, max-age=31536000, immutable";
    }

    server {
        listen 8080;
        listen [::]:8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;
        charset utf-8;

        # We sit behind a TLS-terminating proxy (Cloudflare Tunnel / reverse proxy) that speaks
        # plain HTTP to us on :8080. With nginx's default `absolute_redirect on`, the 303
        # pin-to-latest and content-negotiation redirects rewrite their relative target into an
        # absolute URL built from THIS listener - i.e. http://host:8080/... - leaking the internal
        # scheme and port to clients. Emit relative Location headers instead; the client resolves
        # them against the public https origin it actually requested.
        absolute_redirect off;
        port_in_redirect off;

        # CORS + caching, applied to responses including redirects (`always`). XML tools fetch
        # schemas cross-origin, so allow it broadly for these read-only, public resources.
        add_header Access-Control-Allow-Origin  "*"                 always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Cache-Control                $cairn_cache        always;
        add_header X-Content-Type-Options       "nosniff"           always;

        if ($request_method = OPTIONS) { return 204; }

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        error_page 404 /404.html;
        error_page 410 /410.html;

        # Per-standard namespace docs, pin-to-latest 303s, and 410s (generated by `cairn build`).
        # Wildcard so nginx still starts if the routes file has not been synced yet.
        include /etc/nginx/cairn/*.conf;

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
