name: cairn

# Cairn runs as three small services around two shared volumes:
#   syncer  -> replicates + renders into the volumes every SYNC_INTERVAL
#   web     -> nginx serves the volumes on :8080 (internal), self-reloads for new routes
#   cloudflared (opt-in) -> Cloudflare Tunnel ingress; no inbound ports, TLS at the edge
#
# Ingress options:
#   Local testing:  docker compose -f docker-compose.yml -f docker-compose.local.yml up --build
#                   (publishes 127.0.0.1:8080)
#   Tunnel:         docker compose --profile tunnel up -d --build
#                   (no host ports; traffic arrives via cloudflared over the docker network)

services:
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: cairn-web:latest
    # Internal only by default; reachable by cloudflared over the compose network.
    # Host publishing is added by docker-compose.local.yml for local testing.
    expose:
      - "8080"
    # nginx reloads when the generated routes actually change, checked every RELOAD_POLL
    # seconds (default 60, defined in deploy/web-entrypoint.sh). To override, add:
    #   environment:
    #     RELOAD_POLL: "60"
    volumes:
      - site_data:/usr/share/nginx/html
      - routes_data:/etc/nginx/cairn
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3

  syncer:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.syncer
    image: cairn-syncer:latest
    environment:
      # Cadence defaults (6h sync, 24h integrity re-check) live in deploy/sync-loop.sh.
      # Uncomment to override; leaving them unset keeps one source of truth.
      # SYNC_INTERVAL: "21600"
      # VERIFY_INTERVAL: "86400"
      # --- Manifest source (pick one; default uses the image-baked registry) ---
      # git-pull mode: clone + pull the repo so NEW standards are picked up automatically.
      #   REPO_URL: "https://github.com/OPF-ORG/cairn-standards.git"
      #   REPO_DIR: "/repo"
      #   REPO_BRANCH: "main"
      # bind-mount mode: mount a host checkout and let the host keep it current.
      #   REPO_DIR: "/repo"
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"   # optional: lifts GitHub API rate limits
    volumes:
      - site_data:/data/site
      - routes_data:/data/conf
      # git-pull (clone) mode also needs a place to clone into:
      # - repo_data:/repo
      # bind-mount mode instead:
      # - ../:/repo:ro   # (read-only host checkout; sync writes only to the volumes)
    restart: unless-stopped

  # Opt-in ingress. Enable with: docker compose --profile tunnel up -d
  # Requires CLOUDFLARE_TUNNEL_TOKEN in deploy/.env (cloudflared errors if it is empty).
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: "${CLOUDFLARE_TUNNEL_TOKEN:-}"
    depends_on:
      - web
    restart: unless-stopped

volumes:
  site_data:
  routes_data:
  # repo_data:   # uncomment for git-pull (clone) mode
