# Deploy from the images published by .github/workflows/publish.yml instead of building
# on the host. Without this overlay the base compose file always builds locally, which
# means the running stack is whatever was last built on that machine rather than a known
# release.
#
# Usage:
#   cp .env.example .env          # once per host; set CAIRN_TAG to the release you want
#   docker compose -f docker-compose.yml -f docker-compose.ghcr.yml pull
#   docker compose -f docker-compose.yml -f docker-compose.ghcr.yml up -d
#
# Set it in .env rather than on the command line. CAIRN_TAG is required rather than
# defaulted, which means it is required by every subcommand, including `down`, `stop`, `logs`
# and `ps` - and needing to remember the tag before you can stop a running stack is a bad
# thing to discover during an incident. See .env.example for what the tag may be, and for
# why there is no default.
#
# Pinning a release is the safer habit for a service whose whole promise is that published
# bytes do not move.
#
# Both packages are created by the first publish run and default to private, so the host
# needs either the packages set to public or a `docker login ghcr.io` with a read token
# before the pull below will succeed.
services:
  web:
    build: !reset null
    image: ghcr.io/openpreserve/cairn-standards/web:${CAIRN_TAG:?set CAIRN_TAG to a release version (e.g. 0.2.0), or to latest for main}

  syncer:
    build: !reset null
    image: ghcr.io/openpreserve/cairn-standards/syncer:${CAIRN_TAG:?set CAIRN_TAG to a release version (e.g. 0.2.0), or to latest for main}
